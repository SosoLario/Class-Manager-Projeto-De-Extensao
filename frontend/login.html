<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Acesse o ClassManager demonstrativo.">
  <title>Entrar | ClassManager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=5">
</head>
<body class="login-body">
  <main class="login-wrap">
    <a class="login-brand" href="index.html"><span class="brand-mark">CM</span><span>Class<span class="brand-light">Manager</span></span></a>
    <section class="login-card">
      <p class="eyebrow mb-2">BEM-VINDO DE VOLTA</p>
      <h1>Entrar no sistema</h1>
      <p class="login-subtitle">Acesse o painel demonstrativo da escola.</p>
      <div id="loginError" class="login-error" role="alert" aria-live="polite"></div>
      <form id="loginForm">
        <label class="form-field"><span>E-mail</span><input name="email" type="email" required autocomplete="username" placeholder="admin@exemplo.com"></label>
        <label class="form-field"><span>Senha</span><input name="password" type="password" required autocomplete="current-password" placeholder="Sua senha"></label>
        <button class="primary-button login-submit" id="loginSubmit" type="submit">Entrar <i data-lucide="arrow-right"></i></button>
      </form>
      <p class="small mt-3"><a href="reset-password.html">Esqueci minha senha</a></p>
      <p class="login-demo-note"><i data-lucide="info"></i> Administradores, professores, secretaria e alunos entram por esta tela. Cada perfil é encaminhado à sua própria área.</p>
    </section>
    <p class="login-footer">ClassManager · Projeto acadêmico demonstrativo</p>
  </main>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
