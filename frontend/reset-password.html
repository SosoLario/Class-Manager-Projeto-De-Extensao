<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar senha | ClassManager</title><link rel="stylesheet" href="css/styles.css"><style>.reset-card{max-width:520px;margin:10vh auto;padding:28px;background:#fff;border-radius:16px}.reset-card form{display:grid;gap:14px}.reset-card input{padding:11px;border:1px solid #ccd3df;border-radius:8px}.reset-card [hidden]{display:none}</style></head><body class="login-body"><main class="reset-card"><a href="login.html">← Voltar ao login</a><h1>Recuperar senha</h1><p>Informe seu e-mail ou defina uma nova senha com o link recebido.</p><form id="requestForm"><label>E-mail<input name="email" type="email" autocomplete="email" required></label><button class="primary-button">Enviar instruções</button></form><form id="resetForm" hidden><label>Nova senha (mínimo 10 caracteres)<input name="password" type="password" minlength="10" required></label><button class="primary-button">Redefinir senha</button></form><p id="message" role="status"></p></main><script src="js/api.js"></script><script>
const params=new URLSearchParams(location.search),token=params.get('token'),msg=document.querySelector('#message'),req=document.querySelector('#requestForm'),reset=document.querySelector('#resetForm');if(token){req.hidden=true;reset.hidden=false}req.onsubmit=async e=>{e.preventDefault();try{const data=await ClassManagerApi.request('auth/request-reset',{method:'POST',body:{email:req.elements.email.value}});msg.textContent=data.development_token?`Token local de desenvolvimento: ${data.development_token}`:data.message}catch(err){msg.textContent=err.message}};reset.onsubmit=async e=>{e.preventDefault();try{const data=await ClassManagerApi.request('auth/reset-password',{method:'POST',body:{token,password:reset.elements.password.value}});msg.textContent=data.message;reset.hidden=true}catch(err){msg.textContent=err.message}};
</script></body></html>
